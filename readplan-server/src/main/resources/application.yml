server:
  port: 8080

spring:
  application:
    name: readplan-server
  datasource:
    url: jdbc:mysql://localhost:3306/readplan?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations:
        - optional:file:./db/schema.sql
        - optional:file:readplan-server/db/schema.sql
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

knife4j:
  enable: true
  setting:
    language: zh_cn

readplan:
  security:
    jwt-secret: please-change-me-readplan-jwt-secret-2026
    jwt-expire-minutes: 120
  storage:
    book-dir: ./storage/books
