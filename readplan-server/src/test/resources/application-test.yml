spring:
  datasource:
    url: jdbc:h2:mem:readplan;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=USER,COMMENT
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:schema.sql

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

readplan:
  security:
    jwt-secret: test-readplan-jwt-secret-2026-for-integration
    jwt-expire-minutes: 120
